<!DOCTYPE html>
<html>
<head>
    <title>City API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-container {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .results {
            margin-top: 20px;
            border: 1px solid #eee;
            padding: 15px;
            background: #f9f9f9;
            max-height: 400px;
            overflow-y: auto;
        }
        .city-item {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🌍 City Autocomplete API Test</h1>
    
    <div class="test-container">
        <h2>Test the API</h2>
        <input type="text" id="cityInput" placeholder="Type a city name (e.g., paris, london, new york)">
        <button onclick="searchCities()">Search</button>
        
        <div id="status"></div>
        <div id="results" class="results"></div>
    </div>

    <div class="test-container">
        <h2>API Information</h2>
        <p><strong>Endpoint:</strong> <code>http://localhost:9000/api/cities</code></p>
        <p><strong>Parameters:</strong></p>
        <ul>
            <li><code>q</code> - Search query (minimum 2 characters)</li>
            <li><code>limit</code> - Max results (default: 20, max: 100)</li>
        </ul>
        <p><strong>Example:</strong> <code>http://localhost:9000/api/cities?q=paris&limit=10</code></p>
    </div>

    <script>
        let timeout;

        document.getElementById('cityInput').addEventListener('input', (e) => {
            clearTimeout(timeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                document.getElementById('results').innerHTML = '';
                document.getElementById('status').innerHTML = '';
                return;
            }

            timeout = setTimeout(() => searchCities(), 300);
        });

        async function searchCities() {
            const query = document.getElementById('cityInput').value.trim();
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            if (query.length < 2) {
                statusDiv.innerHTML = '<div class="error">Please enter at least 2 characters</div>';
                resultsDiv.innerHTML = '';
                return;
            }

            statusDiv.innerHTML = '<div>Searching...</div>';
            resultsDiv.innerHTML = '';

            try {
                const startTime = Date.now();
                const response = await fetch(`http://localhost:9000/api/cities?q=${encodeURIComponent(query)}&limit=20`);
                const data = await response.json();
                const duration = Date.now() - startTime;

                if (!response.ok) {
                    throw new Error(data.error || 'API request failed');
                }

                statusDiv.innerHTML = `<div class="success">✅ Found ${data.length} results in ${duration}ms</div>`;

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>No cities found</p>';
                } else {
                    resultsDiv.innerHTML = data.map(city => {
                        const locationParts = city.subcountry ? `${city.subcountry}, ${city.country}` : city.country;
                        return `<div class="city-item">
                            <strong>${city.name}</strong>, ${locationParts}
                            <span style="color: #666; font-size: 12px;">(ID: ${city.id})</span>
                        </div>`;
                    }).join('');
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                resultsDiv.innerHTML = '';
            }
        }
    </script>
</body>
</html>
