<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="icon" type="image/png" href="images/sun.png">
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    
    <form class="weatherForm">
        <div class="search-container">
            <input type="text" class="cityInput" placeholder="Search for a city..." autocomplete="off" required>
            <button type="submit" class="search-icon" title="Search weather">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
            <button type="button" class="location-btn" id="locationBtn" title="Use my location">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </button>
            <ul id="suggestions"></ul>
        </div>
        <select class="stateSelect" style="display:none">
            <option value="">State (Optional)</option>
        </select>
        <select class="countrySelect" style="display:none" required>
            <option value="">Select Country</option>
        </select>
    </form>

    <!-- Loading Spinner -->
    <div class="loading-container" style="display:none">
        <div class="loading-spinner"></div>
        <p class="loading-text">Fetching weather data...</p>
    </div>

    <div class = "Heading" style="display:none">
    <h1 class="City"></h1>
    <button id="favButton" class="favButton" style="display:none">Add to favorites</button>
    </div>

    <div class="card" style="display: none">

    </div>

    <!-- Share and Add Location buttons -->
    <div class="action-buttons" style="display:none">
        <button id="shareButton" class="actionBtn">📤 Share Weather</button>
        <button id="addLocationBtn" class="actionBtn">📍 Save Location</button>
        <button id="subscribeNewsletterBtn" class="actionBtn">📧 Subscribe</button>
    </div>

    <!-- Hourly Forecast Section -->
    <div class="hourly-forecast-container" style="display:none">
        <h2>24-Hour Forecast</h2>
        <div id="hourlyForecast" class="hourly-scroll"></div>
    </div>

    <!-- Daily Forecast Section -->
    <div class="daily-forecast-container" style="display:none">
        <h2>7-Day Forecast</h2>
        <div id="dailyForecast" class="daily-table"></div>
    </div>

    <!-- Saved Locations Section -->
    <div class="saved-locations-container" style="display:none">
        <div class="saved-locations-header">
            <h2>📍 My Locations</h2>
        </div>
        <div id="savedLocationsList" class="saved-locations-grid"></div>
    </div>

    <!-- Newsletter Subscription Modal -->
    <div id="newsletterModal" class="modal">
        <div class="modal-content">
            <span class="close-newsletter">&times;</span>
            <h2>Subscribe to Weather Updates</h2>
            <p>Get daily weather updates for <strong><span id="subCityName"></span></strong> delivered to your inbox!</p>
            <form id="newsletterForm">
                <div class="form-group">
                    <label for="subEmail">Email address:</label>
                    <input type="email" id="subEmail" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="submitBtn">Subscribe</button>
            </form>
            <p class="note">You can unsubscribe anytime. We respect your privacy.</p>
        </div>
    </div>

    <script src="weather.js"></script>
</body>
</html>
